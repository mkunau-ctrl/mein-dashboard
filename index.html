<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mein Dashboard</title>
  <link rel="icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <main id="app">
    <!-- Login -->
    <section id="login-ansicht" hidden>
      <div class="login-kopf">
        <button id="theme-toggle-login" type="button" class="theme-toggle" title="Hell/Dunkel wechseln"></button>
      </div>
      <h1>Mein Dashboard</h1>
      <p>Melde dich mit deiner E-Mail an. Du bekommst einen Login-Link geschickt.</p>
      <form id="login-form">
        <input type="email" id="email" required autocomplete="email"
               placeholder="m.kunau@gmx.de" />
        <button type="submit">Login-Link senden</button>
      </form>
      <p class="trenner">oder</p>
      <button id="passkey-login" type="button">Mit Passkey anmelden</button>
      <p id="login-hinweis" role="status"></p>
    </section>

    <!-- Dashboard -->
    <section id="dashboard-ansicht" hidden>
      <header>
        <h1 id="modul-titel">Mein Dashboard</h1>
        <div class="kopf-aktionen">
          <button id="glocke" type="button" class="theme-toggle glocke-knopf" title="Meldungen" aria-label="Meldungen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span id="glocke-badge" class="glocke-badge" hidden></span>
          </button>
          <button id="neu-laden-global" type="button" title="Aktualisieren">⟳</button>
          <button id="theme-toggle-dashboard" type="button" class="theme-toggle" title="Hell/Dunkel wechseln"></button>
        </div>
      </header>
      <div id="glocke-panel" class="glocke-panel" hidden></div>
      <section id="modul-detail"></section>
      <nav id="tab-leiste-unten"></nav>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
